<div class="login-box">
  <div class="mv-m text-center">
    <img src="../../../assets/images/logo-dark.svg" height="50" alt="">
  </div>
  <div class="login-box-body">
    <p class="login-box-msg" ng-if="!$ctrl.requireMfa">Sign in to start your session</p>
    <p class="login-box-msg" ng-if="$ctrl.requireMfa">Two-factor authentication</p>
    <form name="loginForm" ng-submit="$ctrl.login()">
      <div ng-if="!$ctrl.requireMfa">
        <div class="form-group has-feedback has-feedback-left">
          <input type="text" class="form-control" placeholder="Login" ng-model="$ctrl.params.username" autocomplete="off" required>
          <i class="form-control-feedback glyphicon glyphicon-user"></i>
        </div>
        <div class="form-group has-feedback has-feedback-left">
          <input type="password" class="input form-control" placeholder="Password" ng-model="$ctrl.params.password" autocomplete="off" required>
          <i class="form-control-feedback glyphicon glyphicon-lock "></i>
        </div>
      </div>

      <div ng-if="$ctrl.requireMfa">
        <p class="text-muted mb-s">
          Enter the 6-digit code from your authenticator app, or one of your backup codes.
        </p>
        <div class="form-group has-feedback has-feedback-left">
          <input type="text" class="form-control" placeholder="Authentication code" ng-model="$ctrl.params.code"
                 auto-focus="login-mfa-code" autocomplete="one-time-code" required>
          <i class="form-control-feedback glyphicon glyphicon-qrcode"></i>
        </div>
      </div>

      <div class="row">
        <div class="col-xs-12">
          <button type="submit" class="btn btn-primary btn-m btn-block" ng-disabled="loginForm.$invalid">
            <span ng-if="!$ctrl.requireMfa">Sign In</span>
            <span ng-if="$ctrl.requireMfa">Verify</span>
          </button>
        </div>
      </div>

      <div class="mv-xs" ng-if="$ctrl.requireMfa">
        <a href class="btn btn-link btn-block" ng-click="$ctrl.cancelMfa()">Use a different account</a>
      </div>

      <div class="sso-login-box" ng-if="$ctrl.ssoEnabled() && !$ctrl.requireMfa">
        <div class="mt-s or-separator">OR</div>

        <div class="mv-xs">
          <a class="btn btn-success btn-m btn-block" href="./api/ssoLogin">Sign In with SSO</a>
        </div>
      </div>

    </form>
  </div>
</div>
